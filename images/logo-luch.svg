<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <!-- Неоновый световой эффект -->
    <filter id="neon-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фон прозрачный -->
  
  <!-- Световая линия-луч слева (символизирует луч света) -->
  <line x1="20" y1="140" x2="200" y2="140" 
        stroke="#00d4ff" 
        stroke-width="5" 
        stroke-linecap="round"
        filter="url(#neon-glow)"/>
  
  <!-- Текст "ЛУЧ" в светлом неоновом стиле -->
  <text x="240" y="210" 
        font-family="'Inter', 'Helvetica Neue', sans-serif" 
        font-size="160" 
        font-weight="300"
        fill="#ffffff" 
        filter="url(#neon-glow)"
        letter-spacing="5">ЛУЧ</text>
</svg>